name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly real-data benchmark against live NOAA gauges (Mondays 06:17 UTC).
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check tideglass

  # --- v0.2: scheduled real-data benchmark (Marea Core vs reference gauge) ---
  # Runs on a cron and manually. Uses only Marea Core (`--against none`) so it
  # never depends on the unmaintained `pytides` package. Network to NOAA may be
  # flaky, so a failure here does not block the required CI jobs above.
  realdata-bench:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Bench bundled NOAA sample (offline, required signal)
        run: |
          shopt -s nullglob
          for csv in data/*.csv; do
            echo "== $csv =="
            tideglass bench "$csv" --against none || \
              echo "::warning::bench failed for $csv (non-gauge CSV in data/? gauge grids belong in data/grids/)"
          done
        shell: bash

      - name: Fetch + bench live NOAA gauge (best-effort)
        continue-on-error: true
        run: |
          END=$(date -u +%Y-%m-%d)
          BEGIN=$(date -u -d '-45 days' +%Y-%m-%d)
          tideglass fetch 9414290 "$BEGIN" "$END" --out live.csv
          tideglass bench live.csv --against none --test-fraction 0.3
        shell: bash

