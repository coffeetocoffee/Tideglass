name: Publish to PyPI

on:
  release:
    types: [published]
  # Also allow manual publishing of a tag like v0.1.0.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # PyPI "trusted publishing" (OIDC) — no stored API tokens required.
    # Configure a trusted publisher at pypi.org/project/tideglass/settings/publishing
    # pointing at this repository and the "release" environment below.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
