[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tideglass"
version = "2.1.1"
description = "Tide + marine-life intelligence engine (Marea Core math engine)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
tideglass = "tideglass.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tideglass*"]
